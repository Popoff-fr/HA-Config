  - item: logbook
    hide: true
  - new_item: true
    item: "Clear Frontend Cache"
    icon: "mdi:cached"
    bottom: true
    order: 3
    on_click:
      action: 'javascript'
      code: |
        const event = new CustomEvent(
          'll-custom',
          {
            detail: {
              uix: {
                action: 'clear_cache'
              }
            }
          }
        );
        document.dispatchEvent(event);  
