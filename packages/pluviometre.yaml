sensor:
  - platform: history_stats
    name: "pluviometre_on"
    entity_id: binary_sensor.pluviometre_contact
    state: "on"
    type: count
    start: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "pluviometre_off"
    entity_id: binary_sensor.pluviometre_contact
    state: "off"
    type: count
    start: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0) }}"
    end: "{{ now() }}"


input_number:
  compteur_pluie_on:
    name: Compteur Pluie Activé
    initial: 0
    min: 0
    max: 1000
    step: 1
  compteur_pluie_off:
    name: Compteur Pluie Désactivé
    initial: 0
    min: 0
    max: 1000
    step: 1