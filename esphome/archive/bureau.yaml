esphome:
  name: bureau-proxy
  friendly_name: Bureau-Proxy
  name_add_mac_suffix: false

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid_routeur
  password: !secret wifi_password_routeur
  manual_ip:
    static_ip: 192.168.2.182
    gateway: 192.168.2.1
    subnet: 255.255.255.0

api:
  encryption:
    key: "ANyYx/SzglB/hczVSCZtw6ppOaXmfYf8TOzgc9v56DA="

logger:

ota:
  platform: esphome

improv_serial:

esp32_ble:
  max_connections: 4

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: false

bluetooth_proxy:
  active: true

button:
  - platform: restart
    name: "Redémarrer proxy"