- id: '1763325868670'
  alias: Notification Détections Nuit
  description: ''
  triggers:
  - trigger: sun
    event: sunrise
    offset: 00:01:00
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: input_boolean.detection_humains_nuit
      state:
      - 'on'
