- id: '1782664209913'
  alias: Frigo - Alerte montée rapide de température
  description: 'Alerte si le frigo monte de plus de 3°C en 10 minutes

    '
  triggers:
  - minutes: /5
    trigger: time_pattern
  actions:
  - if:
    - condition: template
      value_template: '{{ delta > 2 }}'
    then:
    - data:
        title: "\U0001F6A8 Frigo cuisine - Alerte température"
        message: 'Montée de {{ delta | round(1) }}°C en 10 min ! Température actuelle
          : {{ temp_actuelle }}°C

          '
        data:
          importance: high
          ttl: 0
          priority: high
          notification_icon: mdi:thermometer-alert
      action: notify.mobile_app_galaxys25
    - action: notify.mobile_app_sm_g781b
      data:
        message: 'Montée de {{ delta | round(1) }}°C en 10 min ! Température actuelle
          : {{ temp_actuelle }}°C'
        title: "\U0001F6A8 Frigo cuisine - Alerte température"
        data:
          importance: high
          ttl: 0
          priority: high
          notification_icon: mdi:thermometer-alert
  - target:
      entity_id: input_number.evolution_temperature_frigo_cuisine
    data:
      value: '{{ temp_actuelle }}'
    action: input_number.set_value
  mode: single
  variables:
    temp_actuelle: '{{ states(''sensor.capteur_temperature_frigo_cuisine_temperature'')
      | float(0) }}'
    temp_reference: '{{ states(''input_number.evolution_temperature_frigo_cuisine'')
      | float(0) }}'
    delta: '{{ temp_actuelle - temp_reference }}'
