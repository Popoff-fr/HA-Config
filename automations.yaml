- id: '1683549850230'
  alias: Démarrage Pompe Piscine Matin
  description: ''
  triggers:
  - at: '10:00:00'
    trigger: time
  conditions:
  - condition: or
    conditions:
    - condition: numeric_state
      entity_id: sensor.moyenne_production_solaire_cabanon_30min
      above: 700
    - condition: numeric_state
      entity_id: sensor.temperature_piscine_temperature
      above: 25
    - condition: template
      value_template: '{{ (as_timestamp(now()) - as_timestamp(states(''input_datetime.date_et_heure_derniere_filtration_piscine'')))|int
        > 172000 }}'
  - condition: device
    type: is_off
    device_id: 95ad2e36919c21c8b6d0320dfe6a2aca
    entity_id: bd80c77305de665184df92ae840238e8
    domain: switch
  - condition: state
    entity_id: binary_sensor.pac
    state:
    - 'off'
  actions:
  - type: turn_on
    device_id: 95ad2e36919c21c8b6d0320dfe6a2aca
    entity_id: switch.pompe_piscine
    domain: switch
  mode: single
- id: '1687956283574'
  alias: Démarrage Pompe Piscine Après-Midi
  description: ''
  triggers:
  - at: '14:00:00'
    trigger: time
  conditions:
  - condition: numeric_state
    entity_id: sensor.moyenne_production_solaire_cabanon_30min
    above: 700
  - condition: device
    type: is_off
    device_id: 95ad2e36919c21c8b6d0320dfe6a2aca
    entity_id: bd80c77305de665184df92ae840238e8
    domain: switch
  actions:
  - type: turn_on
    device_id: 95ad2e36919c21c8b6d0320dfe6a2aca
    entity_id: switch.pompe_piscine
    domain: switch
  mode: single
- id: '1687956363599'
  alias: Arrêt Pompe Piscine Après-Midi
  description: ''
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.moyenne_production_solaire_cabanon_30min
    below: 800
  conditions:
  - condition: state
    entity_id: switch.pompe_piscine
    state: 'on'
  - condition: time
    after: '17:00:00'
  actions:
  - type: turn_off
    device_id: 95ad2e36919c21c8b6d0320dfe6a2aca
    entity_id: switch.pompe_piscine
    domain: switch
  - data:
      entity_id: input_datetime.date_et_heure_derniere_filtration_piscine
      timestamp: '{{ as_timestamp(now()) }}'
    action: input_datetime.set_datetime
  mode: single
- id: '1715700122612'
  alias: Détection Salon Damien
  description: ''
  use_blueprint:
    path: SgtBatten/Stable.yaml
    input:
      camera:
      - camera.camera_salon
      notify_device: 12a79500c39768be13ccb4e257e431db
      attachment: '{{base_url}}/api/frigate{{client_id}}/notifications/{{id}}/thumbnail.jpg'
      zones: []
      zone_filter: false
      presence_filter:
      - group.nous
      icon: mdi:{{'motion-sensor' if label == 'Person' else 'dog' if label == 'Dog'
        else 'cat' if label == 'Cat' else 'car' if label == 'Car' else 'home-assistant'}}
      video: '{{base_url}}/api/frigate{{client_id}}/notifications/{{id}}/{{camera}}/clip.mp4'
      message: '{{description}}'
      final_update: true
      title: '{{ ''Une personne'' if label == ''Person'' else ''Un chien'' if label==''Dog''
        else ''Minouche'' if label==''Cat''}} {{''a été détectée'' if label==''Person''
        else ''a été détecté'' if label==''Dog'' or ''Cat'' }} sur la {{ camera_name
        }} '
      final_delay: 15
