- id: '1766136902688'
  alias: Frigate GenAI MAJ 1
  description: Première MAJ de notif Frigate
  triggers:
  - topic: frigate/tracked_object_update
    trigger: mqtt
  conditions:
  - condition: template
    value_template: '{{ trigger.payload_json[''type''] == ''description'' }}'
  actions:
  - data:
      message: 'Payload reçu : {{ trigger.payload_json }}'
      level: info
    action: system_log.write
  - data:
      title: Détection sur la {{ trigger.payload_json['camera'] | replace('_', ' ')
        | title }}
      message: '{{ trigger.payload_json[''description''] }}'
      data:
        tag: '{{ trigger.payload_json[''id''] }}'
        group: '{{ trigger.payload_json[''camera''] }}-frigate-notification'
        url: https:/homeassistant.emmanuelli-billard.fr/api/frigate/notifications/{{
          trigger.payload_json['id'] }}/{{ trigger.payload_json['camera'] }}/clip.mp4
        clickAction: https://homeassistant.emmanuelli-billard.fr/api/frigate/notifications/{{
          trigger.payload_json['id'] }}/{{ trigger.payload_json['camera'] }}/clip.mp4
        image: https://homeassistant.emmanuelli-billard.fr/api/frigate/notifications/{{
          trigger.payload_json['id'] }}/event_preview.gif
        attachment:
          url: https://homeassistant.emmanuelli-billard.fr/api/frigate/notifications/{{
            trigger.payload_json['id'] }}/event_preview.gif
          content-type: image/gif
          hide-thumbnail: false
        actions:
        - action: URI
          title: View Clip
          uri: https://homeassistant.emmanuelli-billard.fr/api/frigate/notifications/{{
            trigger.payload_json['id'] }}/{{ trigger.payload_json['camera'] }}/clip.mp4
        - action: URI
          title: View Snapshot
          uri: https://homeassistant.emmanuelli-billard.fr/api/frigate/notifications/{{
            trigger.payload_json['id'] }}/snapshot.jpg
        - action: silence-{{ trigger.payload_json['camera'] }}
          title: Silence 30m
        notification_icon: mdi:motion-sensor
    action: notify.mobile_app_galaxys25
    enabled: true
  - action: notify.mobile_app_galaxys25
    metadata: {}
    data:
      data:
        notification_icon: mdi:motion-sensor
        message: '{{ trigger.payload_json[''description''] }}'
        data:
          tag: '{{ trigger.payload_json[''id''] }}'
          group: '{{ trigger.payload_json[''camera''] }}-frigate-notification'
          url: https:/homeassistant.emmanuelli-billard.fr/api/frigate/notifications/{{
            trigger.payload_json['id'] }}/{{ trigger.payload_json['camera'] }}/clip.mp4
          clickAction: https://homeassistant.emmanuelli-billard.fr/api/frigate/notifications/{{
            trigger.payload_json['id'] }}/{{ trigger.payload_json['camera'] }}/clip.mp4
          image: https://homeassistant.emmanuelli-billard.fr/api/frigate/notifications/{{
            trigger.payload_json['id'] }}/event_preview.gif
          attachment:
            url: https://homeassistant.emmanuelli-billard.fr/api/frigate/notifications/{{
              trigger.payload_json['id'] }}/event_preview.gif
            content-type: image/gif
            hide-thumbnail: false
          actions:
          - action: URI
            title: View Clip
            uri: https://homeassistant.emmanuelli-billard.fr/api/frigate/notifications/{{
              trigger.payload_json['id'] }}/{{ trigger.payload_json['camera'] }}/clip.mp4
          - action: URI
            title: View Snapshot
            uri: https://homeassistant.emmanuelli-billard.fr/api/frigate/notifications/{{
              trigger.payload_json['id'] }}/snapshot.jpg
          - action: silence-{{ trigger.payload_json['camera'] }}
            title: Silence 30m
      title: Détection sur la {{ trigger.payload_json['camera'] | replace('_', ' ')
        | title   }}
      message: '{{ trigger.payload_json[''description''] }}'
    enabled: false
- id: '1766136994322'
  alias: Frigate GenAI MAJ 2
  description: Deuxième MAJ de notification Frigate
  triggers:
  - trigger: mqtt
    options:
      topic: frigate/reviews
  conditions:
  - condition: template
    value_template: '{{ trigger.payload_json[''type''] == ''genai'' }}'
  actions:
  - data:
      title: "{% set base_title = trigger.payload_json['after']['data']['metadata']['title']
        %} {% set threat = trigger.payload_json['after']['data']['metadata'].get('potential_threat_level',
        0) %}\n{% if threat == 1 %}\n  Needs Review: {{ base_title }}\n{% elif threat
        == 2 %}\n  Security Concern: {{ base_title }}\n{% else %}\n  {{ base_title
        }}\n{% endif %}\n"
      message: '{{ trigger.payload_json[''after''][''data''][''metadata''][''scene'']
        }}'
      data:
        tag: '{{ trigger.payload_json[''after''][''data''][''detections''][0] }}'
        group: '{{ trigger.payload_json[''camera''] }}-frigate-notification'
        image: https://homeassistant.emmanuelli-billard.fr/api/frigate/notifications/{{
          trigger.payload_json['after']['data']['detections'][0] }}/event_preview.gif
