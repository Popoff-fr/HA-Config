- id: '1785603977429'
  alias: Détection Caméra Cour Damien 2
  description: ''
  use_blueprint:
    path: ampersandru/Beta.yaml
    input:
      camera:
      - camera.camera_cour
      notify_device: 12a79500c39768be13ccb4e257e431db
      attachment: '{{base_url}}/api/frigate{{client_id}}/notifications/{{id}}/thumbnail.jpg'
      critical: 'true'
      zones:
      - entree_humains
      - entree_animaux
      zone_multi: false
      zone_filter: true
      color: steelblue
      icon: mdi:{{'motion-sensor' if label == 'Person' else 'dog' if label == 'Dog'
        else 'cat' if label == 'Cat' else 'car' if label == 'Car' else 'home-assistant'}}
      presence_filter:
      - ''
      video: '{{base_url}}/api/frigate{{client_id}}/notifications/{{id}}/clip.mp4'
      message: '{{ ''Damien'' if label == ''Damien'' else ''Une personne'' if label
        == ''Person'' else ''Un chien'' if label==''Dog'' else ''Minouche'' if label==''Cat''}}
        {{''a été détectée'' if label==''Person'' else ''a été détecté'' if label==''Dog''
        or ''Cat'' }} sur la {{ camera_name }} '
      attachment_2: ''
      final_update: true
      genai_sprinter: true
      genai_final: true
