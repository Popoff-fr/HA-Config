        - action: silence-{{ trigger.payload_json['after']['camera'] }}
          title: Silence 30m
        notification_icon: mdi:motion-sensor
    action: notify.mobile_app_galaxys25
    enabled: true
  - action: notify.mobile_app_galaxys25
    metadata: {}
    data:
      title: '{% set base_title = trigger.payload_json[''after''][''data''][''metadata''][''title'']   %}
        {% set threat =   trigger.payload_json[''after''][''data''][''metadata''].get(''potential_threat_level'',   0)
        %}    {% if threat == 1 %}     Needs Review: {{ base_title }}   {% elif threat
        == 2 %}     Security Concern: {{ base_title }}   {% else %}     {{ base_title
        }}   {% endif %}'
      message: '"{{ trigger.payload_json[''after''][''data''][''metadata''][''scene'']
        }}"'
      data:
        notification_icon: mdi:motion-sensor
        data:
          tag: '{{ trigger.payload_json[''after''][''data''][''detections''][0] }}'
