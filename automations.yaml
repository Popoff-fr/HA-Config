  - action: input_boolean.turn_off
    data: {}
    target:
      entity_id:
      - input_boolean.detection_animaux_nuit
      - input_boolean.detection_humains_nuit
  - action: notify.mobile_app_galaxys25
    metadata: {}
    data:
      title: "\U0001F4F7 Résumé des détections de la nuit"
      message: "{%- if states('counter.nombre_detections_animaux_nuit') | default(0)
        | int > 0 %}\n\U0001F43E {{\n  states('counter.nombre_detections_animaux_nuit')
        | int\n  }} {%\n    if states('counter.nombre_detections_animaux_nuit') |
        int == 1\n  %} animal{%\n    else\n  %} animaux{%\n  endif\n%}\n\n\U0001F550Dernière
        détection d'animaux : {{ as_timestamp(states('input_datetime.derniere_detection_animaux'))
        | timestamp_custom('%H:%M') }} \n{%- endif %}\n\n{%- if states('counter.nombre_detections_humains_nuit')
        | default(0) | int > 0 %}\n\U0001F464 {{\n  states('counter.nombre_detections_humains_nuit')
        | int\n  }}{%\n    if states('counter.nombre_detections_humains_nuit') | int
        == 1\n  %} humain{%\n    else\n  %} humains{%\n  endif\n%}\n\n\n\U0001F550Dernière
        détection d'humains : {{ as_timestamp(states('input_datetime.derniere_detection_humains'))
        | timestamp_custom('%H:%M') }}\n{%- endif %}"
      data:
        notification_icon: mdi:motion-sensor
  - action: notify.mobile_app_sm_g781b
    metadata: {}
    data:
      title: "\U0001F4F7 Résumé des détections de la nuit"
      message: "action: notify.mobile_app_galaxys25\nmetadata: {}\ndata:\n  title:
        \U0001F4F7 Résumé des détections de la nuit\n  message: >-\n    {%- if states('counter.nombre_detections_animaux_nuit')
        | default(0) | int >\n    0 %}\n\n    \U0001F43E {{\n      states('counter.nombre_detections_animaux_nuit')
        | int\n      }} {%\n        if states('counter.nombre_detections_animaux_nuit')
        | int == 1\n      %} animal{%\n        else\n      %} animaux{%\n      endif\n
        \   %}\n\n\n    \U0001F550Dernière détection d'animaux : {{\n    as_timestamp(states('input_datetime.derniere_detection_animaux'))
        |\n    timestamp_custom('%H:%M') }} \n\n    {%- endif %}\n\n\n    {%- if states('counter.nombre_detections_humains_nuit')
        | default(0) | int >\n    0 %}\n\n    \U0001F464 {{\n      states('counter.nombre_detections_humains_nuit')
        | int\n      }}{%\n        if states('counter.nombre_detections_humains_nuit')
        | int == 1\n      %} humain{%\n        else\n      %} humains{%\n      endif\n
        \   %}\n\n\n\n    \U0001F550Dernière détection d'humains : {{\n    as_timestamp(states('input_datetime.derniere_detection_humains'))
        |\n    timestamp_custom('%H:%M') }}\n\n    {%- endif %}\n  data:\n    notification_icon:
        mdi:motion-sensor\n"
      data:
        notification_icon: mdi:motion-sensor
  mode: single
