tondre_zone_forsythia:
  sequence:
  - action: mammotion.start_mow
    target:
      entity_id: lawn_mower.coupe_coupe
    data:
      is_mow: true
      is_dump: false
      speed: 0.2
      rain_tactics: 1
      mowing_laps: 3
      areas:
      - switch.coupe_coupe_zone_forsythia
      is_edge: true
      channel_mode: '0'
      obstacle_laps: 0
      channel_width: 9
      toward: 37
      ultra_wave: '2'
  alias: Tondre Zone Forsythia
  description: ''
